AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Robot - voice control of a PC (turn on with Wake-on-LAN, turn off through an SQS queue and an agent). Region us-east-1.

Parameters:
  SkillId:
    Type: String
    Description: Smart Home skill ID. Only this skill can invoke the function.
    NoEcho: true
    AllowedPattern: "^amzn1\\.ask\\.skill\\.[0-9a-f-]{36}$"
  PcMac:
    Type: String
    Description: MAC address of the PC's network adapter, formatted XX-XX-XX-XX-XX-XX.
    NoEcho: true
    AllowedPattern: "^([0-9A-Fa-f]{2}-){5}[0-9A-Fa-f]{2}$"
  LwaClientId:
    Type: String
    Description: Alexa Client Id (the skill's Permissions tab, Send Alexa Events).
    NoEcho: true
  LwaClientSecret:
    Type: String
    Description: Alexa Client Secret (same screen).
    NoEcho: true

Resources:
  TabelaTokens:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: robot-tokens
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1

  # Commands for the PC agent. 60 s retention: a stale command disappears by itself and
  # never shuts the PC down long after it was requested.
  FilaComandos:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: robot-comandos
      MessageRetentionPeriod: 60
      VisibilityTimeout: 30
      ReceiveMessageWaitTimeSeconds: 20
      SqsManagedSseEnabled: true

  # Identity of the PC agent: it can only read and delete messages from this queue. The access
  # key is created by hand (infra/README.md), so the secret never goes through CloudFormation.
  UsuarioAgente:
    Type: AWS::IAM::User
    Properties:
      UserName: robot-agente
      Policies:
        - PolicyName: consume-command-queue
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                Resource: !GetAtt FilaComandos.Arn

  LogsFuncao:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/robot-lambda
      RetentionInDays: 14

  FuncaoRobot:
    Type: AWS::Serverless::Function
    DependsOn: LogsFuncao
    Properties:
      FunctionName: robot-lambda
      CodeUri: ../lambda/
      Handler: robot_lambda.handler.handle
      Runtime: python3.13
      Timeout: 15
      MemorySize: 128
      EventInvokeConfig:
        MaximumRetryAttempts: 0  # no automatic retry: avoids duplicate WakeUp and Response events
      Environment:
        Variables:
          TOKENS_TABLE: !Ref TabelaTokens
          ROBOT_MAC: !Ref PcMac
          LWA_CLIENT_ID: !Ref LwaClientId
          LWA_CLIENT_SECRET: !Ref LwaClientSecret
          ROBOT_ENDPOINT_ID: pc-principal
          QUEUE_URL: !Ref FilaComandos
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt TabelaTokens.Arn
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt FilaComandos.Arn
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:robot-lambda"

  # Smart Home trigger. SAM's AlexaSkill event uses the custom-skill principal
  # (alexa-appkit) and the console rejects the ARN; Smart Home requires alexa-connectedhome.
  PermissaoAlexaSmartHome:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt FuncaoRobot.Arn
      Principal: alexa-connectedhome.amazon.com
      EventSourceToken: !Ref SkillId

Outputs:
  QueueUrl:
    Description: Command queue URL, asked for by the agent's setup. It does not go into Git.
    Value: !Ref FilaComandos
